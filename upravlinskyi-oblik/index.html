// Касовий звіт: GET /api/v1/cashbox-report/operations
function normCash(o){
  return {id:"c:"+o.id, src:"Каса", date:o.at, amount:Math.abs(+o.amount), dir:o.direction==="RECEIPT"?"in":"out",
    branch:o.branchName||null, fop:null, party:(o.counterparty&&(o.counterparty.shortName||o.counterparty.name))||null,
    partyKind:o.counterparty?o.counterparty.kind:null,
    desc:[o.basisText,o.comment,o.equipment,o.operationType].filter(Boolean).join(" · "), kinds:o.purposeKinds||[],
    invKinds:[], rent:o.rent?o.rent.displayCode:null, cashbox:o.cashboxName||null};
}
// Банківська виписка: GET /api/v1/banking/transactions?includeFees=true
function normBank(o){
  return {id:"b:"+o.id, src:"Банк", date:o.receivedAt, amount:Math.abs(+o.amount), dir:o.direction==="INCOMING"?"in":"out",
    branch:null, fop:o.fopName||null, party:o.counterpartyName||o.partyName||null, partyKind:o.counterpartyKind||null,
    desc:o.purpose||"", kinds:[], bankKind:o.kind, invKinds:(o.allocations||[]).map(a=>a.invoiceKind),
    rent:(o.allocations&&o.allocations[0]&&o.allocations[0].rentDisplayCode)||(o.invoiceLink&&o.invoiceLink.rentCode)||null,
    paymentId:o.paymentId||null, isTest:!!o.isTest, currency:o.currency};
}
// Платежі: GET /api/v1/payments
function normPay(o){
  return {id:"p:"+o.id, src:"Платіж", date:o.receivedAt, amount:Math.abs(+o.amount), dir:o.direction==="INCOMING"?"in":"out",
    branch:null, fop:null, party:o.partyName||null, desc:o.description||"", kinds:[], invKinds:[], method:o.method,
    cashOpId:o.cashOperationId||null, rawId:o.id};
}
// Простий CSV: date;amount;direction;branch;fop;party;description;article
function normCsvRow(r, i){
  const amt = parseFloat(String(r.amount||"0").replace(/\s/g,"").replace(",","."));
  const d = String(r.direction||"").toLowerCase();
  return {id:"x:"+(r.id||i)+":"+(r.date||""), src:"CSV", date:r.date, amount:Math.abs(amt),
    dir:(d.startsWith("in")||d.startsWith("над")||d==="+"||(!d&&amt>0))?"in":"out",
    branch:r.branch||null, fop:r.fop||null, party:r.party||null, desc:r.description||"", kinds:[], invKinds:[], csvCode:r.article||null};
}
function detect(o){
  if (o && "purposeKinds" in o && "branchName" in o) return "cash";
  if (o && "accountIban" in o && "fopName" in o) return "bank";
  if (o && "method" in o && "receivedAt" in o && "direction" in o) return "pay";
  return null;
}
function ingest(raw){
  const items = Array.isArray(raw) ? raw : (raw && (raw.items || raw.data)) || [];
  const out = {cash:[], bank:[], pay:[]};
  items.forEach(o => { const t = detect(o); if (t) out[t].push(o); });
  return out;
}
function merge(groups){
  const cash = groups.cash.map(normCash), bank = groups.bank.map(normBank).filter(t=>!t.isTest), pay = groups.pay.map(normPay);
  const cashIds = new Set(groups.cash.map(o=>o.id)), bankPay = new Set(bank.map(t=>t.paymentId).filter(Boolean));
  // платіж, що вже є в касі (cashOperationId) або у виписці (paymentId), не дублюємо
  const payLeft = pay.filter(p => !(p.cashOpId && cashIds.has(p.cashOpId)) && !bankPay.has(p.rawId));
  return {tx: cash.concat(bank, payLeft, groups.csv||[]), dropped: pay.length - payLeft.length};
}

function systemRule(t){
  const k = new Set(t.kinds), ik = new Set(t.invKinds);
  if (t.bankKind === "BANK_FEE") return {code: storeOf(t)!==CENTER ? "3.4.01" : "4.2.02", why:"Банк: комісія"};
  if (k.has("DEPOSIT_IN") || (ik.has("DEPOSIT") && t.dir==="in")) return {code:"8.1.01", why:"CRM: застава"};
  if (k.has("DEPOSIT_RETURN")) return {code:"8.1.02", why:"CRM: повернення застави"};
  if (k.has("DEPOSIT_TO_LOSS")) return {code:"1.1.06", why:"CRM: застава в збиток", reclass:true};
  if (k.has("DEPOSIT_OFFSET")) return {code:"1.1.02", why:"CRM: залік застави в оплату", reclass:true};
  if (k.has("PENALTY")) return {code:"1.1.04", why:"CRM: штраф"};
  if (k.has("REFUND")) return {code:"1.1.99", why:"CRM: повернення коштів"};
  if (k.has("SURCHARGE")) return {code:"1.1.07", why:"CRM: доплата"};
  if (ik.has("SALE_LOST")) return {code:"1.1.05", why:"CRM: продаж втраченого"};
  if ((k.has("PAYMENT_IN") || ik.has("RENT") || ik.has("RENT_TOPUP")) && t.dir==="in") return {code:"1.1.02", why:"CRM: оплата оренди"};
  return null;
}
const ruleCache = new Map();
function rx(s){ if (!ruleCache.has(s)) { try { ruleCache.set(s, new RegExp(s, "i")); } catch(e){ ruleCache.set(s, null); } } return ruleCache.get(s); }
function classify(t){
  if (S.assign[t.id]) return {code:S.assign[t.id], how:"manual", why:"Вручну"};
  if (t.csvCode && ART[t.csvCode]) return {code:t.csvCode, how:"auto", why:"CSV"};
  const s = systemRule(t); if (s) return Object.assign({how:"auto"}, s);
  const hay = [t.desc, t.party].filter(Boolean).join(" ");
  for (const r of S.rules) {
    if (r.dir !== "any" && r.dir !== t.dir) continue;
    const re = rx(r.re); if (re && re.test(hay)) return {code:r.code, how:"rule", why:"Правило: /" + r.re + "/"};
  }
  return {code:null, how:"none", why:""};
}
function storeOf(t){ return S.branchSet[t.id] || t.branch || (t.fop && S.fopBranch[t.fop]) || CENTER; }

/* ============================ ОБЧИСЛЕННЯ ============================ */
function txInScope(){
  return S.tx.filter(t => (!S.period || S.period==="all" || String(t.date||"").slice(0,7)===S.period) && (S.fop==="all" || (t.fop||"—")===S.fop));
}
function stores(){
  const set = new Set(); S.tx.forEach(t => { const s = storeOf(t); if (s!==CENTER) set.add(s); });
  Object.keys(S.inputs).forEach(s => { if (s!==CENTER) set.add(s); });
  return Array.from(set).sort();
}
function inp(store, key){ const v = S.inputs[store] && S.inputs[store][key]; return +v || 0; }
function baseOf(code){ return S.bases[code] || ART[code].base || "Виручка"; }

function compute(){
  const st = stores(), cols = st.concat([CENTER]);
  const raw = {}; // code -> col -> signed value (in=+ / out=−)
  const add = (code, col, v) => { (raw[code] = raw[code] || {}); raw[code][col] = (raw[code][col]||0) + v; };
  const scope = txInScope();
  let open = 0, openSum = 0, autoCnt = 0, centerDirect = 0;
  const dep = {}; cols.forEach(c => dep[c] = {in:0, out:0, kept:0});
  scope.forEach(t => {
    const c = classify(t), col = storeOf(t);
    t._c = c; t._store = col;
    if (!c.code) { open++; openSum += t.amount; return; }
    if (c.how !== "manual") autoCnt++;
    const sv = t.dir === "in" ? t.amount : -t.amount;
    if (c.reclass) { add(c.code, col, t.amount); dep[col].kept += t.amount; add("8.1.03", col, -t.amount); return; }
    add(c.code, col, sv);
    if (c.code === "8.1.01") dep[col].in += sv; if (c.code === "8.1.02") dep[col].out += -sv;
  });
  // ручні дані (амортизація)
  st.forEach(s => { if (inp(s,"amortFleet")) add("6.1.01", s, -inp(s,"amortFleet")); if (inp(s,"amortCar")) add("6.2.01", s, -inp(s,"amortCar")); if (inp(s,"amortOther")) add("6.3.01", s, -inp(s,"amortOther")); });
  if (inp(CENTER,"amortOther")) add("6.3.01", CENTER, -inp(CENTER,"amortOther"));

  // P&L значення: доходи = signed, витрати = −signed
  const isPL = code => ["rev","cogs","direct","gen","amort","fin","tax"].includes(ART[code].type);
  const val = {}; Object.keys(raw).forEach(code => { if (!isPL(code)) return; const sign = (ART[code].type==="rev" || code==="7.1.02") ? 1 : -1; val[code] = {}; Object.entries(raw[code]).forEach(([c,v]) => val[code][c] = sign * v); });

  // бази розподілу
  const revBy = {}; st.forEach(s => { revBy[s] = 0; Object.keys(val).forEach(code => { if (ART[code].type==="rev") revBy[s] += (val[code][s]||0); }); });
  const baseVals = {"Виручка":revBy, "Парк_шт":{}, "Парк_варт":{}, "Площа":{}, "Договори":{}};
  const keyMap = {"Парк_шт":"units","Парк_варт":"fleetValue","Площа":"area","Договори":"contracts"};
  st.forEach(s => Object.entries(keyMap).forEach(([b,k]) => baseVals[b][s] = inp(s,k)));
  const shares = {}, fallback = new Set();
  BASES.forEach(b => { const tot = st.reduce((a,s)=>a+Math.max(0,baseVals[b][s]||0),0); shares[b] = {};
    st.forEach(s => shares[b][s] = tot>0 ? Math.max(0,baseVals[b][s]||0)/tot : null);
    if (tot<=0) fallback.add(b); });
  const share = (b, s) => { if (shares[b][s] != null) return shares[b][s]; const t = st.reduce((a,x)=>a+Math.max(0,revBy[x]),0); return t>0 ? Math.max(0,revBy[s])/t : 1/st.length; };

  // розподіл колонки «Центр» на магазини
  const alloc = {}; // code -> store -> value
  Object.keys(val).forEach(code => {
    alloc[code] = {}; st.forEach(s => alloc[code][s] = val[code][s] || 0);
    const c = val[code][CENTER] || 0;
    if (c && st.length) { const b = baseOf(code); if (!["gen","fin","tax"].includes(ART[code].type) && code!=="6.3.01") centerDirect += Math.abs(c);
      st.forEach(s => alloc[code][s] += c * share(b, s)); }
  });
  return {st, raw, val, alloc, revBy, baseVals, shares, fallback, open, openSum, autoCnt, centerDirect, dep, scope};
}

function renderPnl(R){
  const st = R.st, cols = st;
  const get = (code, s) => (R.alloc[code] && R.alloc[code][s]) || 0;
  const sumCodes = (codes, s) => codes.reduce((a,c)=>a+get(c,s),0);
  const codesOf = (pref) => A.map(a=>a[0]).filter(c => c.startsWith(pref));
  const line = {}; const rows = [];
  const tot = arr => arr.reduce((a,b)=>a+b,0);
  const mk = (label, fn, kind, code) => { const v = cols.map(fn); const r = {label, v, t:tot(v), kind, code}; rows.push(r); return r; };
  const sec = label => rows.push({label, kind:"sec"});
  const det = code => mk(ART[code].name, s => get(code,s), "det", code);
  const ratio = (label, num, den) => rows.push({label, kind:"memo", pct:true, v: cols.map((_,i)=>den.v[i]? num.v[i]/den.v[i] : null), t: den.t ? num.t/den.t : null});

  sec("Виручка");
  const dirs = [["1.1","Оренда"],["1.2","Продаж інструменту"],["1.3","Витратні матеріали"],["1.4","Доставка"]];
  dirs.forEach(([p,n]) => { codesOf(p+".").forEach(det); line["rev"+p] = mk("Виручка: "+n, s => sumCodes(codesOf(p+"."), s), "sub"); });
  line.rev = mk("Виручка разом", s => dirs.reduce((a,[p])=>a+sumCodes(codesOf(p+"."),s),0), "key");
  sec("Собівартість");
  const cg = [["2.1","Оренда"],["2.2","Продаж інструменту"],["2.3","Витратні матеріали"],["2.4","Доставка"]];
  cg.forEach(([p,n]) => { codesOf(p+".").forEach(det); line["cogs"+p] = mk("Собівартість: "+n, s => sumCodes(codesOf(p+"."), s), "sub"); });
  line.cogs = mk("Собівартість разом", s => cg.reduce((a,[p])=>a+sumCodes(codesOf(p+"."),s),0), "sub");
  sec("Валовий прибуток за напрямками");
  dirs.forEach(([p,n],i) => { const g = mk("Валовий прибуток: "+n, (s,j) => line["rev"+p].v[j] - line["cogs"+cg[i][0]].v[j], "sub"); line["gp"+p] = g; ratio("маржа", g, line["rev"+p]); });
  line.gp = mk("Валовий прибуток разом", (s,j) => line.rev.v[j] - line.cogs.v[j], "key"); ratio("валова маржа", line.gp, line.rev);
  mk("довідково: валовий прибуток оренди після амортизації парку", (s,j) => line["gp1.1"].v[j] - get("6.1.01",s), "memo");
  mk("довідково: валовий прибуток доставки після амортизації авто", (s,j) => line["gp1.4"].v[j] - get("6.2.01",s), "memo");
  sec("Прямі витрати магазину");
  codesOf("3.").forEach(det);
  line.dir = mk("Прямі витрати разом", s => sumCodes(codesOf("3."), s), "sub");
  line.marg = mk("Маржинальний прибуток магазину", (s,j) => line.gp.v[j] - line.dir.v[j], "key"); ratio("маржинальність", line.marg, line.rev);
  mk("довідково: після амортизації парку магазину", (s,j) => line.marg.v[j] - get("6.1.01",s), "memo");
  sec("Загальні витрати (розподілені)");
  codesOf("4.").forEach(det);
  line.gen = mk("Загальні витрати разом", s => sumCodes(codesOf("4."), s), "sub");
  line.ebitda = mk("EBITDA", (s,j) => line.marg.v[j] - line.gen.v[j], "key"); ratio("EBITDA-маржа", line.ebitda, line.rev);
  sec("Амортизація");
  codesOf("6.").forEach(det);
  line.am = mk("Амортизація разом", s => sumCodes(codesOf("6."), s), "sub");
  line.ebit = mk("EBIT (операційний прибуток)", (s,j) => line.ebitda.v[j] - line.am.v[j], "key");
  sec("Фінансові статті та податки");
  ["7.1.01","7.1.02","7.2.01","7.3.01","7.3.02"].forEach(det);
  line.net = mk("Чистий прибуток", (s,j) => line.ebit.v[j] - get("7.1.01",s) + get("7.1.02",s) - get("7.2.01",s) - get("7.3.01",s) - get("7.3.02",s), "key");
  ratio("чиста маржа", line.net, line.rev);

  const showZero = load("showZero", false);
  const tiles = [["Виручка", line.rev.t], ["Валовий прибуток", line.gp.t, line.rev.t], ["Маржинальний прибуток", line.marg.t, line.rev.t], ["EBITDA", line.ebitda.t, line.rev.t], ["Чистий прибуток", line.net.t, line.rev.t]];
  let h = `<h2>P&amp;L за магазинами</h2><p class="sub">Касовий метод: доходи і витрати за датою руху грошей у CRM. Загальні витрати з «${esc(CENTER)}» розподілені на магазини за базами з довідника. Суми в гривнях.</p>`;
  h += `<div class="tiles">` + tiles.map(([l,v,r]) => `<div class="tile"><div class="l">${l}</div><div class="v${v<0?' neg':''}">${money(v)}</div>${r?`<div class="d">${pct(v/r)} від виручки</div>`:`<div class="d">${R.scope.length} операцій у періоді</div>`}</div>`).join("");
  if (R.open) h += `<div class="tile alert" onclick="location.hash='queue'"><div class="l">Нерозібрано</div><div class="v">${money(R.openSum)}</div><div class="d">${R.open} платежів без статті — P&amp;L неповний</div></div>`;
  h += `</div>`;
  if (R.centerDirect > 0) h += `<div class="banner warn"><span>⚠</span><div><b>${money(R.centerDirect)} грн прямих статей без магазину</b> розподілено за базою. Призначте магазин у «Розборі платежів» або задайте ФОП → магазин у «Дані поза CRM».</div></div>`;
  if (R.fallback.size) h += `<div class="banner warn"><span>⚠</span><div>Бази <b>${[...R.fallback].join(", ")}</b> не заповнені, для них використано частку виручки. Заповніть їх у «Дані поза CRM».</div></div>`;
  h += `<div class="toolbar"><label class="row small" for="zeroT"><input type="checkbox" id="zeroT" ${showZero?"checked":""}> Показати статті з нулем</label></div>`;
  h += `<div class="frame ${showZero?"showzero":""}" id="pnlFrame"><table><thead><tr><th>Код</th><th>Показник</th>${cols.map(c=>`<th class="n">${esc(c)}</th>`).join("")}<th class="n">Разом</th><th class="n">% виручки</th></tr></thead><tbody>`;
  rows.forEach(r => {
    if (r.kind === "sec") { h += `<tr class="sec"><td></td><td colspan="${cols.length+3}">${r.label}</td></tr>`; return; }
    if (r.pct) { h += `<tr class="memo"><td></td><td>&nbsp;&nbsp;${r.label}</td>${r.v.map(v=>`<td class="n">${pct(v)}</td>`).join("")}<td class="n">${pct(r.t)}</td><td></td></tr>`; return; }
    const zero = r.kind==="det" && r.v.every(v=>Math.abs(v)<0.5);
    h += `<tr class="${r.kind}${zero?" zero":""}"><td class="code">${r.code||""}</td><td>${esc(r.label)}${r.code&&R.val[r.code]&&R.val[r.code][CENTER]?` <span class="pill" title="Частина суми розподілена з «${esc(CENTER)}» за базою ${esc(baseOf(r.code))}">розп. ${esc(baseOf(r.code))}</span>`:""}</td>${r.v.map(v=>`<td${cls(v)}>${money(v)}</td>`).join("")}<td${cls(r.t)}>${money(r.t)}</td><td class="n muted">${line.rev && line.rev.t && r.kind!=="memo" ? pct(r.t/line.rev.t) : ""}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  document.getElementById("v-pnl").innerHTML = h;
  document.getElementById("zeroT").onchange = e => { save("showZero", e.target.checked); document.getElementById("pnlFrame").classList.toggle("showzero", e.target.checked); };
  return line;
}

/* ============================ РОЗБІР ПЛАТЕЖІВ ============================ */
function articleOptions(sel, dir){
  let h = `<option value="">— стаття —</option>`, cur = "";
  A.forEach(a => { const sec = a[0][0]; if (sec !== cur) { if (cur) h += `</optgroup>`; h += `<optgroup label="${a[0][0]}. ${SECNAMES[sec]}">`; cur = sec; }
    h += `<option value="${a[0]}"${a[0]===sel?" selected":""}>${a[0]} ${esc(a[1])}</option>`; });
  return h + `</optgroup>`;
}
function renderQueue(R){
  const st = stores();
  let list = R.scope.slice();
  if (S.qFilter === "open") list = list.filter(t => !t._c.code);
  if (S.qFilter === "auto") list = list.filter(t => t._c.code && t._c.how !== "manual");
  if (S.qFilter === "manual") list = list.filter(t => t._c.how === "manual");
  if (S.qFilter === "nostore") list = list.filter(t => t._store === CENTER && t._c.code && !["gen","fin","tax","np"].includes(ART[t._c.code].type));
  if (S.qSearch) { const q = S.qSearch.toLowerCase(); list = list.filter(t => [t.desc,t.party,t.fop,t._store].join(" ").toLowerCase().includes(q)); }
  list.sort((a,b) => b.amount - a.amount);
  const per = 100, pages = Math.max(1, Math.ceil(list.length/per)); if (S.qPage >= pages) S.qPage = 0;
  const page = list.slice(S.qPage*per, S.qPage*per+per);
  const f = (v, l) => `<option value="${v}"${S.qFilter===v?" selected":""}>${l}</option>`;
  let h = `<h2>Розбір платежів</h2><p class="sub">Кожен платіж має отримати статтю й магазин. Застави, оплати оренди, штрафи й банківські комісії CRM розпізнає сама, решту розбирають правила за текстом призначення. Що не впізнано — призначте вручну або створіть правило, щоб наступного місяця воно спрацювало саме. Список відсортовано за сумою: великі платежі впливають на P&amp;L найбільше.</p>`;
  h += `<div class="toolbar"><label class="ctl" for="qf">Показати <select id="qf">${f("open","Без статті ("+R.open+")")}${f("nostore","Прямі статті без магазину")}${f("auto","Розібрані автоматично")}${f("manual","Розібрані вручну")}${f("all","Усі")}</select></label>
    <label class="ctl" for="qs">Пошук <input type="text" id="qs" value="${esc(S.qSearch)}" placeholder="контрагент, призначення…"></label>
    <span class="muted small">${list.length} платежів · ${money(list.reduce((a,t)=>a+t.amount,0))} грн</span></div>`;
  h += `<div class="frame"><table><thead><tr><th>Дата</th><th>Джерело</th><th>Магазин</th><th>Контрагент / призначення</th><th class="n">Сума</th><th>Стаття</th><th></th></tr></thead><tbody>`;
  page.forEach(t => {
    const c = t._c, badge = c.how==="manual" ? `<span class="pill good">вручну</span>` : c.how==="none" ? `<span class="pill warn">не розібрано</span>` : `<span class="pill" title="${esc(c.why)}">${esc(c.why.length>28?c.why.slice(0,26)+"…":c.why)}</span>`;
    h += `<tr data-id="${esc(t.id)}"><td class="small">${esc(String(t.date||"").slice(0,10))}</td><td class="small">${t.src}${t.fop?`<div class="muted">${esc(t.fop)}</div>`:""}</td>
      <td><select class="qstore" aria-label="Магазин">${[CENTER].concat(st).map(s=>`<option${s===t._store?" selected":""}>${esc(s)}</option>`).join("")}</select></td>
      <td><div>${esc(t.party||"—")}</div><div class="desc">${esc(t.desc)}</div></td>
      <td class="n ${t.dir==="out"?"neg":""}">${t.dir==="out"?"−":"+"}${nf.format(t.amount)}</td>
      <td><select class="qart" aria-label="Стаття">${articleOptions(c.code)}</select><div>${badge}</div></td>
      <td><button class="mkrule small" title="Створити правило з цього платежу">+ правило</button></td></tr>`;
  });
  if (!page.length) h += `<tr><td colspan="7" class="muted">Тут порожньо. ${S.qFilter==="open"?"Усі платежі періоду мають статтю.":""}</td></tr>`;
  h += `</tbody></table></div>`;
  if (pages > 1) h += `<div class="toolbar" style="margin-top:10px"><button id="qprev" ${S.qPage?"":"disabled"}>← Назад</button><span class="small muted">Сторінка ${S.qPage+1} з ${pages}</span><button id="qnext" ${S.qPage<pages-1?"":"disabled"}>Далі →</button></div>`;
  h += `<div id="ruleForm"></div>`;
  const v = document.getElementById("v-queue"); v.innerHTML = h;
  v.querySelector("#qf").onchange = e => { S.qFilter = e.target.value; S.qPage = 0; render(); };
  v.querySelector("#qs").onchange = e => { S.qSearch = e.target.value.trim(); S.qPage = 0; render(); };
  if (v.querySelector("#qprev")) { v.querySelector("#qprev").onclick = () => { S.qPage--; render(); }; v.querySelector("#qnext").onclick = () => { S.qPage++; render(); }; }
  v.querySelectorAll("tr[data-id]").forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelector(".qart").onchange = e => { if (e.target.value) S.assign[id] = e.target.value; else delete S.assign[id]; save("assign", S.assign); render(); toast("Статтю збережено"); };
    tr.querySelector(".qstore").onchange = e => { S.branchSet[id] = e.target.value; save("branchSet", S.branchSet); render(); toast("Магазин збережено"); };
    tr.querySelector(".mkrule").onclick = () => {
      const t = S.tx.find(x => x.id === id); const word = (t.party || t.desc || "").split(/[,·;]/)[0].trim().slice(0,40);
      const box = document.getElementById("ruleForm");
      box.innerHTML = `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Нове правило</h3><p class="small muted">Якщо текст призначення або назва контрагента містить фрагмент — призначити статтю. Фрагмент — регулярний вираз без урахування регістру.</p>
        <div class="row"><label class="ctl" for="nrDir">Напрям <select id="nrDir"><option value="${t.dir}">${t.dir==="in"?"надходження":"витрата"}</option><option value="any">будь-який</option></select></label>
        <label class="ctl" for="nrRe">Фрагмент <input type="text" id="nrRe" value="${esc(word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))}" size="30"></label>
        <label class="ctl" for="nrCode">Стаття <select id="nrCode">${articleOptions(t._c.code)}</select></label>
        <button class="primary" id="nrSave">Додати правило</button></div></div>`;
      box.scrollIntoView({behavior:"smooth", block:"nearest"});
      document.getElementById("nrSave").onclick = () => { const re = document.getElementById("nrRe").value.trim(), code = document.getElementById("nrCode").value;
        if (!re || !code) { toast("Вкажіть фрагмент і статтю"); return; } if (!rx(re)) { toast("Фрагмент не є коректним виразом"); return; }
        S.rules.unshift({dir:document.getElementById("nrDir").value, re, code}); save("rules", S.rules); render(); toast("Правило додано й застосовано"); };
    };
  });
}

 ["amortFleet","Амортизація орендного парку, грн/міс","6.1.01"],["amortCar","Амортизація авто доставки, грн/міс","6.2.01"],["amortOther","Амортизація обладнання / ремонтів, грн/міс","6.3.01"],
 ["units","Одиниць орендного парку, шт","база Парк_шт"],["fleetValue","Первісна вартість парку, грн","база Парк_варт"],["area","Площа магазину, м²","база Площа"],["contracts","Договорів оренди за місяць","база Договори"],
 ["daysRented","Днів в оренді (сума по одиницях)","метрика"],["daysAvail","Днів доступності парку","метрика"],["delivContracts","Договорів з доставкою","метрика"],["overdue","Договорів з простроченням","метрика"],["damageRepair","Ремонт після пошкоджень клієнтами, грн","метрика"],

   ["Фізична завантаженість парку","Днів в оренді / днів доступності. Орієнтир 50–70 %, нижче 30 % — продати або перемістити", (s,j)=>div(inp(s,"daysRented"),inp(s,"daysAvail")), "pct", v=>v==null?null:v>=.5?"good":v>=.3?"warn":"bad"],

   ["Маржа доставки (до амортизації авто)","(1.4 − 2.4) / 1.4. Від’ємна — переглянути тарифи або зони", (s,j)=>div(L["gp1.4"].v[j],L["rev1.4"].v[j]), "pct", v=>v==null?null:v>=.2?"good":v>=0?"warn":"bad"],

const SAME_ORIGIN = /budprocat\.com$/i.test(location.hostname);
async function fetchAll(path, params){
  const out = []; let cursor = null, guard = 0;
  do {
    const q = new URLSearchParams(Object.assign({}, params, cursor ? {cursor} : {}, {limit: 200}));
    const r = await fetch(path + "?" + q, {credentials:"include"});
    if (!r.ok) throw new Error(path + ": HTTP " + r.status + (r.status===401?" — увійдіть у CRM у цьому браузері":""));
    const j = await r.json(); const items = Array.isArray(j) ? j : (j.items || []); out.push(...items);
    cursor = Array.isArray(j) ? null : j.nextCursor; guard++;
  } while (cursor && guard < 500);
  return out;
}
async function loadFromCrm(from, to){
  const st = document.getElementById("crmStatus"); st.textContent = "Завантаження…";
  try {
    const [cash, bank, pay] = await Promise.all([
      fetchAll("/api/v1/cashbox-report/operations", {dateFrom:from, dateTo:to}),
      fetchAll("/api/v1/banking/transactions", {dateFrom:from, dateTo:to, includeFees:"true"}),
      fetchAll("/api/v1/payments", {})
    ]);
    const payF = pay.filter(p => { const d = String(p.receivedAt).slice(0,10); return d>=from && d<=to; });
    setData({cash, bank, pay:payF}, "crm"); st.textContent = `Готово: каса ${cash.length}, банк ${bank.length}, платежі ${payF.length}.`;
  } catch(e){ st.textContent = "Помилка: " + e.message; }
}
function setData(groups, source){

function parseCsv(text){
  const sep = (text.split("\n")[0].match(/;/g)||[]).length >= (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0;i<text.length;i++){ const ch = text[i];
    if (q) { if (ch==='"' && text[i+1]==='"') { cur+='"'; i++; } else if (ch==='"') q=false; else cur+=ch; }
    else if (ch==='"') q=true; else if (ch===sep) { row.push(cur); cur=""; } else if (ch==="\n") { row.push(cur); rows.push(row); row=[]; cur=""; } else if (ch!=="\r") cur+=ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r => Object.fromEntries(head.map((h,i)=>[h, (r[i]||"").trim()])));
}

   ["warn","6. Немає собівартості проданого","CRM знає ціну продажу, але не віддає закупівельну ціну проданих позицій і залишкову вартість б/в. Тому зараз собівартість = оплати постачальникам за місяць (касовий метод), що спотворює маржу продажу.","<b>Рішення:</b> собівартість рядка реалізації (з 1С або закупівельна ціна номенклатури — поле purchasePrice в CRM є)."],
   ["warn","7. Немає даних про парк","Кількість і вартість одиниць парку, дні в оренді й доступності, амортизація — їх немає в платежах. Без них не рахуються амортизація, бази «Парк_шт/Парк_варт» і половина метрик.", "<b>Рішення:</b> звіт CRM по парку: одиниці з датою й ціною придбання, відділенням приписки, днями в оренді за період. Поки — ручне введення на вкладці «Дані поза CRM»."],
   ["warn","8. Немає сальдо застав за відкритими договорами","Для звірки застав потрібна сума застав, що зараз на руках, по кожному магазину. Рух застав (DEPOSIT_IN / RETURN / TO_LOSS) у CRM є — це добре.","<b>Рішення:</b> показник «застави на руках на дату» по відділеннях у CRM."],
   ["warn","9. Зарплата, податки, кредити — одним платежем на компанію","Виплата ЗП і податків зазвичай іде одним платежем з рахунку, без поділу на магазини й офіс.","<b>Рішення:</b> розбивати ЗП за відомістю (відділення працівника є в CRM), або вводити розподіл вручну. Розподіл за базою на цій сторінці — тимчасовий компроміс."],
   ["good","Що вже є і використовується","Касові операції з відділенням, касою й типом (оплата оренди, застава, повернення застави, штраф, повернення коштів, доплата, утримання застави); банківська виписка з ФОП, контрагентом і банківськими комісіями; зв’язок платежів з орендами й рахунками; дедуплікація каса ↔ платежі ↔ банк.",""]
  ];
  let h = `<h2>Чого не вистачає в даних CRM</h2><p class="sub">Аналіз API розділу платежів (/payments), касового звіту й банківської виписки. Цифри нижче рахуються за поточним періодом і поточним набором даних${S.source==="demo"?" (зараз це приклад)":""}.</p><div class="gap-list">`;
  G.forEach(([s,t,w,f]) => { h += `<div class="gap"><div class="sev ${s}"></div><div class="t">${t}</div><div class="w">${w}</div>${f?`<div class="f">${f}</div>`:""}</div>`; });
  h += `</div><h3>Поля платежу, які варто додати в CRM (для розробника)</h3><div class="frame"><table><thead><tr><th>Поле</th><th>Де</th><th>Навіщо</th></tr></thead><tbody>
  <tr><td class="mono">cashflowArticleCode</td><td>Payment, CashOperation, BankTransaction</td><td>Стаття за довідником (1.1.01 … 8.7.01); обов’язкова для вихідних</td></tr>
  <tr><td class="mono">branchId / branchName</td><td>BankTransaction, Payment</td><td>Магазин для безготівки</td></tr>
  <tr><td class="mono">allocations[].lineKind</td><td>Payment, BankTransaction</td><td>RENT / DELIVERY / PICKUP / PRODUCT / SERVICE — напрямок доходу</td></tr>
  <tr><td class="mono">allocations[].tariffKind</td><td>Payment (оренда)</td><td>HOURLY / DAILY / LONG_TERM</td></tr>
  <tr><td class="mono">allocations[].productGroup, costAmount</td><td>Payment (продаж)</td><td>Новий / б/в з парку / витратні та собівартість рядка</td></tr>
  <tr><td class="mono">legalEntity (fopId)</td><td>CashOperation</td><td>Юрособа для готівки (зараз є лише в банку)</td></tr>
  <tr><td class="mono">GET /reports/fleet</td><td>новий звіт</td><td>Одиниці парку: відділення, дата й ціна придбання, дні в оренді за період</td></tr>
  <tr><td class="mono">GET /reports/deposits-on-hand</td><td>новий звіт</td><td>Застави на руках на дату по відділеннях</td></tr>
  </tbody></table></div>`;
  document.getElementById("v-gaps").innerHTML = h;
}

/* ============================ РЕНДЕР ============================ */
function periods(){ return [...new Set(S.tx.map(t=>String(t.date||"").slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort(); }
const MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
function renderHeader(R){
  const ps = periods();
  document.getElementById("period").innerHTML = ps.map(p=>`<option value="${p}"${p===S.period?" selected":""}>${MONTHS[+p.slice(5)-1]} ${p.slice(0,4)}</option>`).join("") + `<option value="all"${S.period==="all"?" selected":""}>увесь період</option>`;
  const fops = [...new Set(S.tx.map(t=>t.fop||"—"))].sort();
  document.getElementById("fopSel").innerHTML = `<option value="all">усі</option>` + fops.map(f=>`<option${f===S.fop?" selected":""}>${esc(f)}</option>`).join("");
  const q = document.getElementById("qcnt"); q.hidden = !R.open; q.textContent = R.open;
  const b = document.getElementById("srcBanner");
  b.innerHTML = S.source==="demo" ? `<div class="banner demo"><span>ℹ</span><div><b>Зараз показано приклад, а не ваші дані.</b> Щоб побачити свої цифри, імпортуйте вивантаження з CRM на вкладці «Джерела даних». Що потрібно змінити в CRM — на вкладці «Чого не вистачає».</div></div>` : "";
}
function render(keepScroll){
  const ps = periods(); if (!S.period || (S.period!=="all" && !ps.includes(S.period))) S.period = ps[ps.length-1] || "all";
  const R = compute(); renderHeader(R);
  const L = renderPnl(R); renderQueue(R); renderInputs(); renderMetrics(R, L); renderDeposits(R); renderCash(R); renderRules(); renderData(); renderGaps(R);
  showView();
}
function showView(){
  const v = (location.hash||"#pnl").slice(1); const ok = document.getElementById("v-"+v) ? v : "pnl";
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-"+ok);
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === ok));
}
window.addEventListener("hashchange", showView);
document.getElementById("period").onchange = e => { S.period = e.target.value; save("period", S.period); render(); };
document.getElementById("fopSel").onchange = e => { S.fop = e.target.value; render(); };

/* ============================ СТАРТ ============================ */
(function init(){
  const saved = load("tx", null);
  if (saved && saved.tx && saved.tx.length) { S.tx = saved.tx; S.source = saved.source; S.loadedAt = saved.loadedAt; }
  else {
    if (!Object.keys(S.inputs).length) S.inputs = JSON.parse(JSON.stringify(DEMO_INPUTS));
    if (!Object.keys(S.fopBranch).length) S.fopBranch = Object.assign({}, DEMO_FOPBRANCH);
    const m = merge(demo()); S.tx = m.tx; S.source = "demo";
  }
  render();
})();
</script>
